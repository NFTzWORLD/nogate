  <script>
  (function () {
    var N = 576;
    var TID = 272;
    var PAL = ["#121212", "#ececec", "#dc2028", "#ff7a18", "#ffd400", "#28c846", "#3dfff6", "#285ae6", "#ff2ea6"];

        return arr;
      } catch (e) { return null; }
    }
    function arrSafe(n) {

      if (n < 0) return 0;
