<style>
  :root { --body:#1a1c1e; --body2:#2c3036; --ink:#f2f2f2; --accent:#e10600; --lcd:#061208; --digit:#7dff9a; --cheeks:#101114; --metal:#8a9098; }

  .top { width:100%; display:flex; align-items:flex-start; }
  .brand small { display:block; letter-spacing:.2em; font:600 1.5vmin/1 ui-sans-serif,system-ui,sans-serif; opacity:.7; }
  .brand b { display:block; margin-top:.25vmin; color:var(--accent); letter-spacing:.22em; font:700 1.6vmin/1 ui-sans-serif,system-ui,sans-serif; }
  .brand strong { display:block; font:760 4.2vmin/.95 ui-sans-serif,system-ui,sans-serif; }
  .year { font:600 1.6vmin/1 ui-monospace,Menlo,monospace; opacity:.7; }
  .chip { margin-left:auto; font:600 1.8vmin/1 ui-monospace,Menlo,monospace; border:1px solid currentColor; border-radius:999px; padding:.35em .7em; }
  .window {
    width:78%; height:16%;

    border-radius:8px;
    box-shadow:inset 0 3px 10px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.15);
    display:flex; align-items:center; justify-content:space-around;
  }
  .reel {
    width:9vmin; height:9vmin; border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, transparent 0 18%, #111 19% 28%, var(--metal) 29% 42%, #111 43% 100%);
    box-shadow:inset 0 0 0 2px #222, 0 2px 4px rgba(0,0,0,.5);
  }
  body.playing .reel { animation:spin 1.1s linear infinite; }
  body.recording .reel { animation:spin .45s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .lcdbox {
    width:78%; background:var(--lcd); color:var(--digit);
    border-radius:6px; box-shadow:inset 0 3px 8px rgba(0,0,0,.65);
    padding:2.2% 4%;
    font:700 3.2vmin/1.15 ui-monospace,Menlo,monospace; letter-spacing:.06em;
  }
  .line { display:block; margin-top:.6vmin; font:500 1.7vmin/1.3 ui-sans-serif,system-ui,sans-serif; letter-spacing:0; opacity:.85; }
  .grille {
    width:70%; height:7%;
    background:repeating-linear-gradient(180deg, #111 0 2px, #2a2a2a 2px 4px);
    border-radius:4px; opacity:.85;
  }
  .controls { margin-top:auto; display:flex; align-items:center; justify-content:center; gap:8%; width:100%; }
  .red {
    width:28vmin; height:28vmin; border:0; border-radius:50%; cursor:pointer; padding:0;
    background:radial-gradient(circle at 36% 30%, #ff6a5a, var(--accent) 42%, #6a0008 78%);
    box-shadow:0 1.4vmin 0 #3a0006, inset 0 2px 0 rgba(255,255,255,.4);
  }
  body.playing .red { transform:translateY(.45vmin); box-shadow:0 .5vmin 0 #3a0006, 0 0 22px var(--accent), inset 0 2px 0 rgba(255,255,255,.3); }
  .rec {
    width:10vmin; height:10vmin; border:0; border-radius:50%; cursor:pointer; color:var(--ink);
    background:radial-gradient(circle at 35% 30%, #4a4a4a, #151515 70%);
    box-shadow:0 .5vmin 0 #000, inset 0 1px 0 rgba(255,255,255,.25);
    font:750 1.5vmin/1 ui-sans-serif,system-ui,sans-serif; letter-spacing:.12em;
  }
  .rec.on { background:radial-gradient(circle at 35% 30%, #ff4a4a, #8a0008 70%); color:#fff; }
</style>

<script>
var KIT = {"id":1,"slug":"night","room":"Night Wire","year":"1968","voice":"Daniel","line":"Wire one. The street is quiet.","body":"#1a1c1e","body2":"#2c3036","ink":"#f2f2f2","accent":"#e10600","lcd":"#061208","digit":"#7dff9a","cheeks":"#101114","metal":"#8a9098","title":"NIGHT WIRE","room_id":"night","groove":"Tape","note":"TAPE 01","lcdIdle":"TAPE 01","hint":"Test recorder. 1968 Night Wire. The big red button plays the tape: \"Wire one. The street is quiet.\" Record keeps a new take in this session only. The factory tape stays on the token.","set":"AMP","edition":"TEST","shape":"Recorder"};
/* NFTzWORLD WIRE. Big red button plays the tape. KIT is baked above this script. */
var factory = document.getElementById("factory");
var take = null;
var recorder = null;
var chunks = [];
var stream = null;
var recording = false;
var stopTimer = 0;

function lcd(text) {
  document.getElementById("lcd").textContent = text;
}

function current() {
  return take || factory;
}

function stopPlay() {
  [factory, take].forEach(function (a) {
    if (!a) return;
    a.pause();
    try { a.currentTime = 0; } catch (e) {}
  });
  document.body.classList.remove("playing");
}

function playRed() {
  if (recording) return;
  var a = current();
  if (a && !a.paused) {
    stopPlay();
    lcd(take ? "TAKE" : KIT.lcdIdle);
    return;
  }
  stopPlay();
  var played = a.play();
  document.body.classList.add("playing");
  lcd(take ? "PLAY TAKE" : "PLAY");
  if (played && played.catch) played.catch(function () { lcd("TAP AGAIN"); });
  a.onended = function () {
    document.body.classList.remove("playing");
    lcd(take ? "TAKE" : KIT.lcdIdle);
  };
}

function finishTake() {
  if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
  stream = null;
  var blob = new Blob(chunks, { type: (recorder && recorder.mimeType) || "audio/webm" });
  if (take) URL.revokeObjectURL(take.src);
  take = new Audio(URL.createObjectURL(blob));
  recording = false;
  document.getElementById("rec").classList.remove("on");
  document.body.classList.remove("recording");
  lcd("TAKE");
}

function stopRec() {
  if (stopTimer) clearTimeout(stopTimer);
  stopTimer = 0;
  if (recorder && recorder.state === "recording") recorder.stop();
  else finishTake();
}

function armRec() {
  if (recording) {
    stopRec();
    return;
  }
  stopPlay();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    lcd("NO MIC");
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
    stream = s;
    chunks = [];
    recorder = new MediaRecorder(s);
    recorder.ondataavailable = function (e) {
      if (e.data && e.data.size) chunks.push(e.data);
    };
    recorder.onstop = finishTake;
    recorder.start();
    recording = true;
    document.getElementById("rec").classList.add("on");
    document.body.classList.add("recording");
    lcd("REC");
    stopTimer = setTimeout(function () {
      if (recording) stopRec();
    }, 8000);
  }).catch(function () {
    lcd("NO MIC");
  });
}

document.getElementById("red").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  playRed();
});
document.getElementById("rec").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  armRec();
});
window.addEventListener("keydown", function (e) {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " ") {
    e.preventDefault();
    playRed();
  }
});

document.getElementById("model").textContent = String(KIT.room).toUpperCase();
document.getElementById("year").textContent = KIT.year;
document.getElementById("chip").textContent = "#" + String(KIT.id).padStart(2, "0");
document.getElementById("line").textContent = KIT.line;
lcd(KIT.lcdIdle);
var shell = document.querySelector(".shell");
["body", "body2", "ink", "accent", "lcd", "digit", "cheeks", "metal"].forEach(function (k) {
  if (KIT[k]) shell.style.setProperty("--" + k, KIT[k]);
});
shell.dataset.cheeks = KIT.cheeks ? "1" : "0";

function fit() {
  var s = document.querySelector(".shell");
  var n = Math.min(window.innerWidth, window.innerHeight);
  if (n) {
    s.style.width = n + "px";
    s.style.height = n + "px";
  }
}
window.addEventListener("resize", fit);
fit();

if (new URLSearchParams(location.search).get("qa") === "1") {
  var lines = [];
  function check(name, ok) { lines.push((ok ? "PASS" : "FAIL") + " " + name); }
  check("red", !!document.getElementById("red"));
  check("audio", factory && String(factory.src).indexOf("data:audio/wav") === 0);
  check("line", document.getElementById("line").textContent === KIT.line);
  document.getElementById("red").dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
  check("play", document.body.classList.contains("playing") || !factory.paused);
  var pre = document.createElement("pre");
  pre.id = "qa";
  var fails = lines.filter(function (l) { return l.indexOf("FAIL") === 0; }).length;
  pre.textContent = (fails ? "FAILED " + fails : "ALL PASS " + lines.length) + "\n" + lines.join("\n");
  pre.style.cssText = "position:absolute;left:0;right:0;bottom:0;margin:0;background:#000;color:#ccff00;font:12px/1.35 ui-monospace,monospace;z-index:9;padding:8px";
  document.body.appendChild(pre);
}

</script>
