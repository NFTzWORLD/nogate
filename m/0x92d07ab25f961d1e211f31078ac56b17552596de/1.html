<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NFTzWORLD Arcade</title>
  <style>
    :root {
      --crt-left: 28.36%; --crt-top: 34.03%; --crt-w: 43.63%; --crt-h: 27.60%;
      --marq-left: 19.5%; --marq-top: 5.4%; --marq-w: 61%; --marq-h: 12.2%;
      --green: #00ff6a;
    }
    html, body { margin: 0; background: #07080c; }
    .cab { position: relative; width: 100%; max-width: 720px; margin: 0 auto; }
    .wood { width: 100%; height: auto; display: block; }
    .marquee {
      position: absolute; left: var(--marq-left); top: var(--marq-top);
      width: var(--marq-w); height: var(--marq-h);
      display: flex; align-items: center; justify-content: center;
      font: 700 clamp(10px, 3vw, 22px) ui-monospace, monospace;
      letter-spacing: 0.16em; color: var(--green);
      text-shadow: 0 0 8px var(--green), 0 0 18px #146b12;
      pointer-events: none;
    }
    .crt {
      position: absolute; left: var(--crt-left); top: var(--crt-top);
      width: var(--crt-w); height: var(--crt-h);
      overflow: hidden; border-radius: 7% / 6%; background: #000; cursor: pointer;
    }
    .crt img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .scan {
      position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0,255,106,.06) 0 1px, transparent 1px 3px);
      opacity: .45;
    }
    .hud {
      position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
      padding: 4px 8px; font: 10px ui-monospace, monospace; color: var(--green);
      background: linear-gradient(to top, rgba(0,0,0,.55), transparent);
    }
  </style>
