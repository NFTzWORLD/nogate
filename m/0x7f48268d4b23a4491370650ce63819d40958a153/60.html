    }
    function arrSafe(n) {
      n = n | 0;
      if (n < 0) return 0;
      if (n >= PAL.length) return n % PAL.length;
      return n;
    }
    function paint(el, i) {
      var peg = el.firstChild;
      peg.style.background = PAL[bits[i]];
      peg.style.boxShadow = GLOW[bits[i]];
    }
    function openCover() {
      cover.style.display = "none";
    }
    cover.onclick = function () { openCover(); };
    if (/open=1/.test(location.search)) openCover();
    var saved = load();
    var grid = document.getElementById("grid");
    var html = "";
    for (var i = 0; i < N; i++) {
      bits[i] = saved ? arrSafe(saved[i]) : 0;
      html += '<button type="button" class="hit" id="p'+i+'"><span class="peg"></span></button>';
    }
    grid.innerHTML = html;
    if (saved) openCover();
    for (var j = 0; j < N; j++) {
      (function (i) {
        var el = document.getElementById("p"+i);
        paint(el, i);
        el.onclick = function (ev) {
          openCover();
          var dir = ev.shiftKey ? -1 : 1;
          bits[i] = (bits[i] + dir + PAL.length) % PAL.length;
          paint(el, i);
          save();
        };
      })(j);
    }
  })();
  </script>
</body>
</html>
