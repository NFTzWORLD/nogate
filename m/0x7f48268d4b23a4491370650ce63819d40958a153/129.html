      <div id="help">
        <div>
          <b>BPAP #129</b><br>
          Laser Yellow · Candy Rings<br>
          TAP COVER TO OPEN<br>
          <i>16×16 pegs · tap a peg to light it · shift-tap reverses · saves here</i>
        </div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    var N = 256;
    var TID = 129;
    var PAL = ["#111114", "#ffffff", "#ff0040", "#ff5a00", "#ffff00", "#39ff14", "#00ffff", "#4d7cff", "#ff00aa"];
    var GLOW = ["inset 0 0 0 1px #070708", "0 0 6px #fff, 0 0 16px #fff", "0 0 6px #ff0040, 0 0 18px #ff0040", "0 0 6px #ff5a00, 0 0 18px #ff5a00", "0 0 6px #ffff00, 0 0 18px #ffff00", "0 0 6px #39ff14, 0 0 18px #39ff14", "0 0 6px #00ffff, 0 0 18px #00ffff", "0 0 6px #4d7cff, 0 0 18px #4d7cff", "0 0 6px #ff00aa, 0 0 18px #ff00aa"];
    var KEY = "nftzworld-britepad-" + TID;
    var bits = [];
    var cover = document.getElementById("cover");
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(bits)); } catch (e) {}
    }
    function load() {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return null;
        var arr = JSON.parse(raw);
        if (!arr || arr.length !== N) return null;
        return arr;
      } catch (e) { return null; }
    }
    function arrSafe(n) {
      n = n | 0;
      if (n < 0) return 0;
      if (n >= PAL.length) return n % PAL.length;
      return n;
    }
    function paint(el, i) {
      var peg = el.firstChild;
      peg.style.background = PAL[bits[i]];
      peg.style.boxShadow = GLOW[bits[i]];
    }
    function openCover() {
      cover.style.display = "none";
    }
    cover.onclick = function () { openCover(); };
    if (/open=1/.test(location.search)) openCover();
    var saved = load();
    var grid = document.getElementById("grid");
    var html = "";
    for (var i = 0; i < N; i++) {
      bits[i] = saved ? arrSafe(saved[i]) : 0;
      html += '<button type="button" class="hit" id="p'+i+'"><span class="peg"></span></button>';
    }
    grid.innerHTML = html;
    if (saved) openCover();
    for (var j = 0; j < N; j++) {
      (function (i) {
        var el = document.getElementById("p"+i);
        paint(el, i);
        el.onclick = function (ev) {
          openCover();
          var dir = ev.shiftKey ? -1 : 1;
          bits[i] = (bits[i] + dir + PAL.length) % PAL.length;
          paint(el, i);
          save();
        };
      })(j);
    }
  })();
  </script>
