<!DOCTYPE html>
<!-- NFTzWORLD SNOOZE. Digital clock. No clock hands. Shop https://x.com/NFTzWORLD. Robinhood 4663. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title></title>
<style>
  :root { --accent:#39f3ff; --ink:#39f3ff; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#05060a; color:#f4f7fb; overflow:hidden; user-select:none; touch-action:manipulation; }
  body { display:flex; align-items:center; justify-content:center; font-family:ui-sans-serif,"SF Pro Display","Helvetica Neue",system-ui,sans-serif; }
  .shell { position:relative; width:100vmin; height:100vmin; background:#05060a; }
  .case {
    position:absolute; inset:7%;
    display:flex; flex-direction:column;
    padding:6% 7% 5%;
    background:linear-gradient(180deg, #12141c 0%, #07080c 28%, #07080c 100%);
    border-radius:28px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 18px 40px rgba(0,0,0,.45);
  }
  .shell[data-frame="0"] .case { box-shadow:inset 0 0 0 1px var(--accent), inset 0 1px 0 rgba(255,255,255,.12); }
  .shell[data-frame="1"] .case { box-shadow:inset 0 0 0 1px rgba(255,255,255,.18), inset 0 0 0 6px #07080c, inset 0 0 0 7px var(--accent); }
  .shell[data-frame="2"] .case::before, .shell[data-frame="2"] .case::after {
    content:""; position:absolute; width:18px; height:18px; border:1px solid var(--accent);
  }
  .shell[data-frame="2"] .case::before { top:16px; left:16px; border-right:0; border-bottom:0; }
  .shell[data-frame="2"] .case::after { right:16px; bottom:16px; border-left:0; border-top:0; }
  .shell[data-frame="3"] .case { box-shadow:inset 0 -2px 0 var(--accent), inset 0 1px 0 rgba(255,255,255,.08); }
  .top { display:flex; align-items:flex-start; letter-spacing:.22em; }
  .brand small { display:block; font:600 1.35vmin/1 ui-sans-serif,system-ui,sans-serif; opacity:.55; }
  .brand b { display:block; margin-top:.45vmin; color:var(--accent); font:650 1.45vmin/1 ui-sans-serif,system-ui,sans-serif; }
  .brand strong { display:block; margin-top:1.1vmin; letter-spacing:.04em; font:560 3.3vmin/1 ui-sans-serif,system-ui,sans-serif; }
  .chip { margin-left:auto; font:600 1.6vmin/1 ui-monospace,Menlo,monospace; letter-spacing:.08em; opacity:.8; }
  .meta { margin-top:1.2vmin; display:flex; gap:1.2vmin; align-items:center; font:600 1.35vmin/1 ui-sans-serif,system-ui,sans-serif; letter-spacing:.18em; opacity:.7; }
  .meta i { width:.55vmin; height:.55vmin; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); display:block; }
  .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:0; }
  #face { color:var(--accent); display:flex; align-items:center; justify-content:center; }
  .alarmline {
    margin:1.2vmin 0 0;
    font:200 8.6vmin/1 ui-monospace,"SF Mono",Menlo,monospace;
    letter-spacing:.04em;
    color:var(--accent);
    text-shadow:0 0 12px var(--accent), 0 0 28px color-mix(in srgb, var(--accent) 40%, transparent);
    font-variant-numeric:tabular-nums;
  }
  .edge {
    font:200 13vmin/1 ui-monospace,"SF Mono",Menlo,monospace;
    letter-spacing:.04em;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 10px var(--accent), 0 0 28px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .dig { position:relative; width:5.6vmin; height:9.6vmin; margin:0 .2vmin; }
  .dig i { position:absolute; background:var(--accent); opacity:.08; border-radius:2px; }
  .dig i.on { opacity:1; box-shadow:0 0 8px var(--accent); }
  .dig .a, .dig .g, .dig .d { height:.72vmin; left:14%; width:72%; }
  .dig .a { top:0; } .dig .g { top:46%; } .dig .d { bottom:0; }
  .dig .b, .dig .c, .dig .e, .dig .f { width:.72vmin; height:42%; }
  .dig .f { left:0; top:7%; } .dig .b { right:0; top:7%; }
  .dig .e { left:0; bottom:7%; } .dig .c { right:0; bottom:7%; }
  .colon { display:flex; flex-direction:column; justify-content:space-between; height:7vmin; margin:0 .7vmin; }
  .shell[data-style="segment"] .colon i { width:.7vmin; height:.7vmin; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); display:block; }
  .shell[data-style="tube"] .colon { color:var(--accent); font:500 8vmin/1 ui-monospace,Menlo,monospace; height:auto; text-shadow:0 0 10px var(--accent); }
  .tube {
    width:6.1vmin; height:9.6vmin; margin:0 .22vmin;
    display:flex; align-items:center; justify-content:center;
    border-radius:46%;
    background:radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--accent) 28%, transparent), rgba(0,0,0,.72) 68%);
    box-shadow:inset 0 0 16px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 18px color-mix(in srgb, var(--accent) 35%, transparent);
    font:520 5.2vmin/1 ui-monospace,Menlo,monospace;
    text-shadow:0 0 8px var(--accent);
  }
  .shell[data-style="segment"] .case, .shell[data-style="tube"] .case {
    background-image:repeating-linear-gradient(180deg, transparent 0 2px, rgba(255,255,255,.015) 2px 3px);
  }
  .track { width:86%; height:2px; margin:0 auto 4%; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden; }
  #bar { height:100%; width:100%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  body.done #bar { width:100% !important; animation:flash 1s ease infinite; }
  @keyframes flash { 50% { opacity:.25; } }
  .keys { display:grid; grid-template-columns:1fr 1fr 1.4fr .9fr; gap:2%; }
  .keys button {
    appearance:none; border:1px solid rgba(255,255,255,.14); cursor:pointer; color:#f4f7fb; background:transparent;
    border-radius:999px; font:650 1.7vmin/1 ui-sans-serif,system-ui,sans-serif; letter-spacing:.16em;
    padding:3.2% 0;
  }
  #arm.on { background:var(--accent); color:#071014; border-color:transparent; box-shadow:0 0 16px color-mix(in srgb, var(--accent) 55%, transparent); }
  #wake { display:none; position:absolute; inset:0; z-index:8; background:#050000; flex-direction:column; align-items:center; justify-content:center; gap:2.2%; padding:5% 6%; }
  body.ringing #wake { display:flex; animation:pop .16s ease-out; }
  #wake h1 { margin:0; color:#ff1a1a; font:800 13vmin/.82 Impact,"Arial Black",sans-serif; letter-spacing:.06em; text-align:center; text-shadow:0 0 18px #ff1a1a, 0 .5vmin 0 #4a0000; animation:buzz .1s linear infinite; }
  #wake[data-pop="rise"] h1 { color:#ccff00; text-shadow:0 0 18px #ccff00, 0 .5vmin 0 #243000; }
  #wake[data-pop="late"] { justify-content:flex-start; padding-top:8%; }
  #wake[data-pop="late"] h1 { order:-1; color:#ffb000; text-shadow:0 0 18px #ffb000, 0 .5vmin 0 #3a2400; }
  #wake[data-pop="now"] h1 { color:#39f3ff; text-shadow:0 0 18px #39f3ff, 0 .5vmin 0 #003038; }
  #wake[data-pop="now"] .arts { grid-template-columns:1fr 1fr 1fr 1fr; }
  #oneBanner { display:none; text-align:center; }
  #wake[data-pop="one"] #oneBanner { display:block; }
  #oneBanner b { display:block; letter-spacing:.28em; font:700 1.7vmin/1 ui-sans-serif,system-ui,sans-serif; color:#fff; }
  #oneBanner strong { display:block; margin-top:.4vmin; color:#ff1a1a; font:800 9vmin/.9 Impact,"Arial Black",sans-serif; letter-spacing:.14em; text-shadow:0 0 16px #ff1a1a; }
  .arts { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:2%; }
  .arts img { width:100%; height:16vmin; object-fit:cover; border-radius:10px; border:1px solid #ff1a1a; }
  #wakeSnooze { appearance:none; border:0; cursor:pointer; background:#ff1a1a; color:#1a0000; border-radius:999px; font:800 3.2vmin/1 ui-sans-serif,system-ui,sans-serif; letter-spacing:.22em; padding:3.4% 12%; }
  @keyframes pop { from { transform:scale(.72); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes buzz { 25% { transform:translateX(-1.2%); } 75% { transform:translateX(1.2%); } }
</style>
</head>

    var saved = JSON.parse(raw);
    if (!saved) return;
    if (saved.ah != null) state.ah = ((saved.ah % 24) + 24) % 24;
    if (saved.am != null) state.am = ((saved.am % 60) + 60) % 60;
    armed = !!saved.armed;
  } catch (e) {}
}

function save() {
  try {
    sessionStorage.setItem("nftzworld-timer-" + KIT.id, JSON.stringify({
      ah: state.ah, am: state.am, armed: armed
    }));
  } catch (e) {}
}

function ensure() {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  if (!actx) {
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.22;
    master.connect(actx.destination);
  }
  if (actx.state === "suspended") actx.resume();
  return true;
}

function blip(freq, when, dur) {
  if (!actx) return;
  var o = actx.createOscillator();
  var g = actx.createGain();
  o.type = "sine";
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(0.35, when + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.connect(g);
  g.connect(master);
  o.start(when);
  o.stop(when + dur + 0.02);
}

function sirenBurst() {
  if (!ringing) return;
  if (!ensure()) {
    ringTimer = setTimeout(sirenBurst, 300);
    return;
  }
  master.gain.value = 1;
  var t = actx.currentTime;
  function sweep(type, f0, f1, peak) {
    var o = actx.createOscillator();
    var g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.linearRampToValueAtTime(f1, t + 0.2);
    o.frequency.linearRampToValueAtTime(f0 * 0.7, t + 0.42);
    g.gain.setValueAtTime(peak, t);
    g.gain.setValueAtTime(peak, t + 0.36);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.46);
    o.connect(g);
    g.connect(master);
    o.start(t);
    o.stop(t + 0.48);
  }
  sweep("sawtooth", 380, 1680, 0.72);
  sweep("square", 760, 2400, 0.48);
  sweep("square", 190, 90, 0.4);
  ringTimer = setTimeout(sirenBurst, 420);
}

function buildFace() {
  var face = document.getElementById("face");
  if (KIT.style === "edge") {
    face.innerHTML = '<div class="edge" id="read">00:00:00</div>';
    return;
  }
  if (KIT.style === "tube") {
    var tubes = "";
    for (var i = 0; i < 8; i++) {
      tubes += (i === 2 || i === 5) ? '<b class="colon">:</b>' : '<span class="tube">0</span>';
    }
    face.innerHTML = tubes;
    return;
  }
  var seg = "";
  for (var n = 0; n < 8; n++) {
    if (n === 2 || n === 5) seg += '<b class="colon"><i></i><i></i></b>';
    else seg += '<div class="dig"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><i class="e"></i><i class="f"></i><i class="g"></i></div>';
  }
  face.innerHTML = seg;
}

function showText(text) {
  if (KIT.style === "edge") {
    document.getElementById("read").textContent = text;
    return;
  }
  var digits = text.replace(/:/g, "");
  if (KIT.style === "tube") {
    var nodes = document.querySelectorAll(".tube");
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = digits.charAt(i) || "0";
    return;
  }
  var digs = document.querySelectorAll(".dig");
  var names = ["a", "b", "c", "d", "e", "f", "g"];
  for (var d = 0; d < digs.length; d++) {
    var mask = SEG[digits.charAt(d)] || "0000000";
    for (var s = 0; s < 7; s++) digs[d].querySelector("." + names[s]).classList.toggle("on", mask.charAt(s) === "1");
  }
}

function stopRing() {
  ringing = false;
  if (ringTimer) clearTimeout(ringTimer);
  ringTimer = 0;
  document.body.classList.remove("ringing");
  var wake = document.getElementById("wake");
  if (wake) wake.hidden = true;
}

var HEADS = { wake: "WAKE UP", rise: "RISE", late: "LATE", now: "NOW", one: "WAKE UP" };

function startRing(why) {
  if (ringing) return;
  ringing = true;
  ringWhy = why || "alarm";
  ringStarted = Date.now();
  document.body.classList.add("ringing");
  var wake = document.getElementById("wake");
  if (wake) {
    wake.hidden = false;
    wake.dataset.pop = KIT.popout || "wake";
  }
  var head = document.getElementById("wakeHead");
  if (head) head.textContent = HEADS[KIT.popout] || "WAKE UP";
  ensure();
  sirenBurst();
}

function paint() {
  var now = new Date();
  var h = now.getHours();
  var m = now.getMinutes();
  var s = now.getSeconds();
  showText(pad(h) + ":" + pad(m) + ":" + pad(s));
  var bar = document.getElementById("bar");
  bar.style.width = ((s + now.getMilliseconds() / 1000) / 60) * 100 + "%";
  var alarm = document.getElementById("state");
  if (ringing) alarm.textContent = "RING";
  else if (snoozeAt > Date.now()) alarm.textContent = "SNOOZE";
  else alarm.textContent = (armed ? "ARMED  " : "OFF  ") + stamp(state.ah, state.am);
  document.getElementById("arm").classList.toggle("on", armed);
  document.body.classList.toggle("running", ringing);
  var key = h + ":" + m;
  if (armed && snoozeAt && Date.now() >= snoozeAt && !ringing) {
    snoozeAt = 0;
    startRing("snooze");
  }
  if (armed && !ringing && !snoozeAt && h === state.ah && m === state.am && lastFired !== key) {
    lastFired = key;
    startRing("alarm");
  }
}

document.getElementById("hourUp").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  state.ah = (state.ah + 1) % 24;
  lastFired = "";
  save();
  paint();
});
document.getElementById("minUp").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  state.am = (state.am + 1) % 60;
  lastFired = "";
  save();
  paint();
});
document.getElementById("arm").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  ensure();
  armed = !armed;
  if (!armed) stopRing();
  lastFired = "";
  save();
  paint();
});
function doSnooze(e) {
  if (e) e.preventDefault();
  stopRing();
  if (armed) snoozeAt = Date.now() + 5 * 60 * 1000;
  lastFired = "";
  paint();
}
document.getElementById("snooze").addEventListener("pointerdown", doSnooze);
document.getElementById("wakeSnooze").addEventListener("pointerdown", doSnooze);
document.getElementById("wake").addEventListener("pointerdown", function (e) {
  if (e.target && e.target.id === "wakeSnooze") return;
  ensure();
});

var shell = document.querySelector(".shell");
shell.style.setProperty("--accent", KIT.accent);
shell.style.setProperty("--ink", KIT.ink);
shell.dataset.style = KIT.style;
shell.dataset.frame = String(KIT.frame);
document.getElementById("model").textContent = KIT.title;
document.getElementById("chip").textContent = "#" + String(KIT.id).padStart(3, "0");
document.getElementById("family").textContent = KIT.family;
buildFace();
loadSave();
paint();
setInterval(paint, 200);
if (new URLSearchParams(location.search).get("wake") === "1") startRing("alarm");

function fit() {
  var el = document.querySelector(".shell");
  var n = Math.min(window.innerWidth, window.innerHeight);
  if (!n) return;
  el.style.width = n + "px";
  el.style.height = n + "px";
}
window.addEventListener("resize", fit);
fit();

if (new URLSearchParams(location.search).get("qa") === "1") {
  var lines = [];
  function check(name, ok) { lines.push((ok ? "PASS" : "FAIL") + " " + name); }
  var read = document.getElementById("read");
  var tubeText = "";
  document.querySelectorAll(".tube").forEach(function (n) { tubeText += n.textContent; });
  check("clock", (read && /^\d\d:\d\d:\d\d$/.test(read.textContent)) || tubeText.length === 6 || document.querySelectorAll(".dig").length === 6);
  if (KIT.style !== "edge") {
    var digits = "";
    if (KIT.style === "tube") document.querySelectorAll(".tube").forEach(function (n) { digits += n.textContent; });
    else document.querySelectorAll(".dig").forEach(function () { digits += "0"; });
    check("digits", KIT.style === "segment" ? document.querySelectorAll(".dig").length === 6 : digits.length === 6);
  } else {
    check("digits", document.getElementById("read").textContent.length === 8);
  }
  check("no-hands", !document.getElementById("hour") && !document.querySelector(".hand"));
  var before = state.ah;
  document.getElementById("hourUp").dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
  check("hour", state.ah === (before + 1) % 24);
  document.getElementById("arm").dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
  check("arm", armed === true);
  var pre = document.createElement("pre");
  pre.id = "qa";
  var fails = lines.filter(function (l) { return l.indexOf("FAIL") === 0; }).length;
  pre.textContent = (fails ? "FAILED " + fails : "ALL PASS " + lines.length) + "\n" + lines.join("\n");
  pre.style.cssText = "position:absolute;left:0;right:0;bottom:0;margin:0;background:#000;color:#ccff00;font:12px/1.35 ui-monospace,monospace;z-index:9;padding:8px";
  document.body.appendChild(pre);
}

</script>
</body>
</html>
