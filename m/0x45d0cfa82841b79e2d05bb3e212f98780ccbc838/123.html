AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA//9k=" alt="">
      <div id="help">
        <div>
          <b>DRAW #123</b><br>
          Pink · Pale<br>
          TAP COVER TO OPEN<br>
          <i>24×24 · tap a square to paint · shift-tap reverses · saves here</i>
        </div>

    </div>
  </div>
  <script>
  (function () {
    var N = 576;
    var TID = 123;
    var PAL = ["#121212", "#ececec", "#dc2028", "#ff7a18", "#ffd400", "#28c846", "#3dfff6", "#285ae6", "#ff2ea6"];
    var KEY = "nftzworld-draw-" + TID;
    var bits = [];
    var cover = document.getElementById("cover");
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(bits)); } catch (e) {}
    }
    function load() {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return null;
        var arr = JSON.parse(raw);
        if (!arr || arr.length !== N) return null;
        return arr;
      } catch (e) { return null; }
    }
    function arrSafe(n) {
      n = n | 0;
      if (n < 0) return 0;
      if (n >= PAL.length) return n % PAL.length;
      return n;
    }
    function paint(el, i) {
      el.style.background = PAL[bits[i]];
    }
    function openCover() {
      cover.style.display = "none";
    }
    cover.onclick = function () { openCover(); };
    if (/open=1/.test(location.search)) openCover();
    var saved = load();
    var grid = document.getElementById("grid");
    var html = "";
    for (var i = 0; i < N; i++) {
      bits[i] = saved ? arrSafe(saved[i]) : 0;
      html += '<button type="button" class="px" id="p'+i+'"></button>';
    }
    grid.innerHTML = html;
    if (saved) openCover();
    for (var j = 0; j < N; j++) {
      (function (i) {
        var el = document.getElementById("p"+i);
        paint(el, i);
        el.onclick = function (ev) {
          openCover();
          var dir = ev.shiftKey ? -1 : 1;
          bits[i] = (bits[i] + dir + PAL.length) % PAL.length;
          paint(el, i);
          save();
        };
      })(j);
    }
  })();
  </script>
</body>
