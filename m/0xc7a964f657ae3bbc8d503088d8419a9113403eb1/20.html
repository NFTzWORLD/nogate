function buildPix() {

  canvas.height = 256;

    var r = canvas.getBoundingClientRect();
    if (!r.width) return -1;
    var x = Math.floor((e.clientX - r.left) / r.width * 16);
    var y = Math.floor((e.clientY - r.top) / r.height * 16);
    if (x < 0 || y < 0 || x > 15 || y > 15) return -1;
    return y * 16 + x;

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var i = at(e);

    }
    function up() {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);

    window.addEventListener("pointermove", move);

  state.last = key;
  state.gate = true;
  try {
    if (!ensure()) { render(); return; }
    var t = actx.currentTime;
    var m = NFTzScore.midi(state, key);
    var f = NFTzScore.freq(m);
    var type = NFTzScore.WAVES[state.wave] || "sawtooth";
    var osc = actx.createOscillator();
    setWave(osc, type);
    osc.frequency.setValueAtTime(f, t);
    var osc2 = null;
    if (state.dual) {
      osc2 = actx.createOscillator();
      setWave(osc2, type);
      osc2.frequency.setValueAtTime(f * 1.007, t);
    }
    if (state.vib && actx._lfoGain) {
      actx._lfoGain.connect(osc.frequency);
      if (osc2) actx._lfoGain.connect(osc2.frequency);
    }
    var filter = actx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(NFTzScore.cutoffHz(state.cutoff), t);
    filter.Q.value = 0.7 + state.res * 14;
    var g = actx.createGain();
    var peak = (state.dual ? 0.13 : 0.18) * (1 - state.drive * 0.25);
    var sus = Math.max(0.08, Math.min(0.92, state.sustain));
    var atk = NFTzScore.attackSec(state.attack);
    var dec = 0.03 + state.decay * 0.4;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + atk);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * sus), t + atk + dec);
    osc.connect(filter);
    if (osc2) osc2.connect(filter);
    var shaped = filter;
    if (state.drive > 0.04) {
      var sh = actx.createWaveShaper();
      var curve = new Float32Array(64);
      var amt = 1 + state.drive * 36;
      for (var i = 0; i < 64; i++) {
        var x = (i / 63) * 2 - 1;
        curve[i] = Math.tanh(x * amt);
      }
      sh.curve = curve;
      filter.connect(sh);
      shaped = sh;
    }
    shaped.connect(g);
    g.connect(master);
    if (state.delay > 0.04 && actx._delay) {
      var send = actx.createGain();
      send.gain.value = state.delay * 0.4;
      g.connect(send);
      send.connect(actx._delay);
      actx._delay.delayTime.setTargetAtTime(0.08 + state.delay * 0.28, t, 0.01);
    }
    osc.start(t);
    if (osc2) osc2.start(t);
    active[key] = { osc: osc, osc2: osc2, g: g };
    born.push(key);
    while (born.length > 8) noteOff(born.shift());
  } catch (e) {}
  render();
}

function noteOff(key) {
  var v = active[key];
  if (!v) {
    state.gate = Object.keys(active).length > 0;
    render();
    return;
  }
  delete active[key];
  try {
    var t = actx.currentTime;
    var rel = NFTzScore.releaseSec(state.release);
    v.g.gain.cancelScheduledValues(t);
    var now = Math.max(0.0001, v.g.gain.value || 0.0001);
    v.g.gain.setValueAtTime(now, t);
    v.g.gain.exponentialRampToValueAtTime(0.0001, t + rel);
    v.osc.stop(t + rel + 0.04);
    if (v.osc2) v.osc2.stop(t + rel + 0.04);
  } catch (e) {}
  state.gate = Object.keys(active).length > 0;
  render();
}

function envHit(freq, endFreq, dur, gain) {
  var t = actx.currentTime;
  var o = actx.createOscillator();
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, endFreq), t + dur);
  var g = actx.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
  g.connect(master);
  o.start(t);
  o.stop(t + dur + 0.02);
}

function noiseHit(dur, gain, hp) {
  var t = actx.currentTime;
  var src = actx.createBufferSource();
  src.buffer = actx._noise;
  var filter = actx.createBiquadFilter();
  filter.type = "highpass";
  filter.frequency.value = hp;
  var g = actx.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filter);
  filter.connect(g);
  g.connect(master);
  src.start(t);
  src.stop(t + dur + 0.02);
}

function hitDrum(kind) {
  if (!ensure()) return;
  if (kind === "kick") {
    envHit(168, 46, 0.26, 0.85);
  } else if (kind === "snare") {
    envHit(196, 140, 0.12, 0.28);
    noiseHit(0.16, 0.32, 900);
  } else if (kind === "hat") {
    noiseHit(0.045, 0.16, 7000);
  } else if (kind === "open") {
    noiseHit(0.28, 0.14, 6000);
  } else if (kind === "tom") {
    envHit(220, 120, 0.22, 0.4);
  } else if (kind === "mid") {
    envHit(160, 90, 0.26, 0.42);
  } else if (kind === "floor") {
    envHit(110, 58, 0.34, 0.48);
  } else if (kind === "crash") {
    noiseHit(0.7, 0.16, 4000);
    envHit(520, 280, 0.4, 0.08);
  } else if (kind === "ride") {
    noiseHit(0.45, 0.1, 3200);
  }
}

function flash(el) {
  if (!el) return;
  el.classList.add("hit");
  setTimeout(function () { el.classList.remove("hit"); }, 110);
}

function playDrumString(pattern) {
  for (var i = 0; i < pattern.length; i++) {
    var id = DRUM_LETTERS[pattern.charAt(i)];
    if (!id) continue;
    hitDrum(id);
    flash(document.getElementById(id));
  }
}

function stopScore() {
  playToken += 1;
  state.playing = false;
  if (scoreKey != null) {
    noteOff(scoreKey);
    scoreKey = null;
  }
}

function startScore() {
  stopScore();
  state.playing = true;
  var token = playToken;
  var step = 0;
  function tick() {
    if (token !== playToken || !state.playing) return;
    var steps = KIT.steps || [];
    var drums = KIT.drums || [];
    var ev = steps.length ? steps[step % steps.length] : -1;
    if (scoreKey != null) noteOff(scoreKey);
    scoreKey = null;
    if (ev >= 0) {
      noteOn(ev);
      scoreKey = ev;
      var held = ev;
      var ms = 60000 / Math.max(40, state.bpm);
      setTimeout(function () {
        if (token === playToken && scoreKey === held) {
          noteOff(held);
          scoreKey = null;
        }
      }, ms * 0.7);
    }
    if (drums.length) playDrumString(drums[step % drums.length] || "");
    state.step = step % Math.max(steps.length, drums.length, 1);
    step += 1;
    render();
    setTimeout(tick, 60000 / Math.max(40, state.bpm));
  }
  tick();
}

function render() {
  document.querySelectorAll(".knob").forEach(function (el) {
    var v = state[el.dataset.knob];
    el.style.transform = "rotate(" + (-135 + v * 270) + "deg)";
  });
  var idle = Object.keys(active).length === 0;
  document.querySelectorAll("[data-key]").forEach(function (el) {
    var n = Number(el.dataset.key);
    el.classList.toggle("on", !!active[n] || (idle && n === state.home));
  });
  document.querySelectorAll("#leds i").forEach(function (el) {
    el.classList.toggle("on", state.playing && Number(el.dataset.led) === state.step);
  });
  document.querySelectorAll("#wlamps i").forEach(function (el, idx) {
    el.classList.toggle("on", idx === state.wave);
  });
  document.getElementById("oct").textContent = (state.octave > 0 ? "+" : "") + state.octave;
  document.getElementById("dual").classList.toggle("on", state.dual);
  document.getElementById("vib").classList.toggle("on", state.vib);
  var play = document.getElementById("play");
  if (play) play.classList.toggle("on", state.playing);
  var gate = document.getElementById("sig");
  if (gate) gate.classList.toggle("on", state.gate || state.playing);
  var note = NFTzScore.noteName(state, idle ? state.home : state.last);
  document.getElementById("readout").textContent = note + "  " + NFTzScore.WAVE_NAMES[state.wave] + "  " + state.bpm;
  var trace = document.getElementById("trace");
  if (trace) {
    var pts = [
      "0,30 24,8 24,30 48,8 48,30 72,8 72,30 100,8",
      "0,28 0,10 50,10 50,28 100,28",
      "0,30 25,8 50,30 75,8 100,30",
      "0,30 8,8 16,30 24,8 32,30 40,8 48,30 56,8 64,30 72,8 80,30 88,8 100,30"
    ];
    trace.setAttribute("points", pts[state.wave] || pts[0]);
  }
}

document.getElementById("wave").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  state.wave = (state.wave + 1) % 4;
  render();
});
document.getElementById("octDown").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  state.octave = Math.max(-2, state.octave - 1);
  render();
});
document.getElementById("octUp").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  state.octave = Math.min(2, state.octave + 1);
  render();
});
document.getElementById("dual").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  state.dual = !state.dual;
  render();
});
document.getElementById("vib").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  state.vib = !state.vib;
  render();
});
document.getElementById("play").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  if (state.playing) stopScore();
  else startScore();
  render();
});

window.addEventListener("keydown", function (e) {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (down[e.key]) return;
  if (KIT.kind === "kit" && DRUM_KEYS[e.key]) {
    e.preventDefault();
    down[e.key] = true;
    hitDrum(DRUM_KEYS[e.key]);
    flash(document.getElementById(DRUM_KEYS[e.key]));
    return;
  }
  var key = KEYS[e.key];
  if (key == null) return;
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  e.preventDefault();
  down[e.key] = true;
  noteOn(key);
});
window.addEventListener("keyup", function (e) {
  var key = KEYS[e.key];
  if (DRUM_KEYS[e.key]) down[e.key] = false;
  if (key == null) return;
  down[e.key] = false;
  noteOff(key);
});

function fit() {
  var s = document.querySelector(".shell");
  var n = Math.min(window.innerWidth, window.innerHeight);
  if (!n) return;
  s.style.width = n + "px";
  s.style.height = n + "px";
}
window.addEventListener("resize", fit);
paintChrome();
fit();
render();

if (new URLSearchParams(location.search).get("qa") === "1") {
  var lines = [];
  function check(name, ok, extra) {
    lines.push((ok ? "PASS" : "FAIL") + " " + name + (extra ? " " + extra : ""));
  }
  check("freq", Math.abs(NFTzScore.freq(69) - 440) < 0.01);
  check("twentyfour", document.querySelectorAll("[data-key]").length === 24);
  check("home", document.querySelector('[data-key="' + KIT.home + '"]').classList.contains("on"));
  check("steps", (KIT.steps || []).length >= 8);
  var before = state.wave;
  document.getElementById("wave").dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
  check("wave", state.wave === (before + 1) % 4);
  noteOn(0);
  check("key", state.last === 0);
  noteOff(0);
  if (KIT.kind === "kit") check("drums", document.querySelectorAll("#kit .pad").length === 9);
  if (KIT.kind === "pix") {
    check("pix-black", pix && pix.length === 256 && pix.every(function (n) { return n === 0; }));
    check("pix-canvas", !!document.getElementById("pix"));
  }
  var pre = document.createElement("pre");
  pre.id = "qa";
  var fails = lines.filter(function (l) { return l.indexOf("FAIL") === 0; }).length;
  pre.textContent = (fails ? "FAILED " + fails : "ALL PASS " + lines.length) + "\n" + lines.join("\n");
  pre.style.cssText = "position:absolute;left:0;right:0;bottom:0;max-height:42%;overflow:auto;margin:0;background:#000;color:#ccff00;font:12px/1.35 ui-monospace,monospace;z-index:9;white-space:pre-wrap;padding:8px";
  document.body.appendChild(pre);
}

</script>
