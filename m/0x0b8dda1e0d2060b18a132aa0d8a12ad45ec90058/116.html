    #machine {
      position:absolute; inset:0; z-index:1;
      display:flex; flex-direction:column;
      padding:8.4% 9% 7.5%; box-sizing:border-box;
    }
    #crest { display:block; width:9%; height:auto; margin:0 auto .4%; cursor:pointer; filter:drop-shadow(0 0 12px rgba(204,255,0,.45)); }
    .bank { flex:1; display:flex; flex-direction:column; justify-content:center; min-height:0; gap:2%; }
    .place {
      display:grid; grid-template-columns:repeat(7,1fr);
      text-align:center; color:#ccff00; font-family:Georgia,serif;
      font-size:clamp(11px,2vw,20px); letter-spacing:.04em; text-shadow:0 0 10px rgba(204,255,0,.5);
    }
    .place span.off { color:#5a4630; text-shadow:none; }
    .row { display:grid; grid-template-columns:repeat(7,1fr); gap:1.4%; align-items:center; }
    .cell, .lamp {
      width:78%; max-width:92px; aspect-ratio:1; margin:0 auto; cursor:pointer;
      background:transparent; border:0; padding:0;
    }
    .cell img, .lamp img { width:100%; height:100%; object-fit:contain; pointer-events:none; display:block; }
    .cell.bang, .lamp.bang { animation: bang .18s linear; }
    @keyframes bang { 0% { transform:scale(1); } 40% { transform:scale(1.14); } 100% { transform:scale(1); } }
    #plate {
      margin-top:2%; padding:2.2% 4%;
      background:rgba(10,8,6,.78); cursor:pointer;
      font-family:ui-monospace,Menlo,monospace;
    }
    .line { display:flex; justify-content:space-between; align-items:baseline; color:#ccff00;
      font-size:clamp(16px,3.1vw,34px); line-height:1.35; text-shadow:0 0 8px rgba(204,255,0,.35); }
    .line b { color:#d8c8a0; font-family:Georgia,serif; font-size:.48em; font-weight:400; letter-spacing:.12em; }
    #pop {
      position:absolute; inset:0; z-index:5; pointer-events:none; opacity:0;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.18);
    }
    #pop img { max-width:78%; max-height:78%; object-fit:contain; filter:drop-shadow(0 0 24px #ccff00); }
    body.egg #pop { opacity:1; animation: punch .5s cubic-bezier(.15,1.6,.3,1); }
    @keyframes punch { 0% { transform:scale(.2); } 70% { transform:scale(1.08); } 100% { transform:scale(1); } }
    body.egg #machine { animation: shake .35s linear; }
    @keyframes shake { 0%,100% { transform:translateX(0); } 30% { transform:translateX(-2%); } 60% { transform:translateX(2%); } }
    #flash { position:absolute; inset:0; z-index:4; pointer-events:none; background:#ccff00; opacity:0; }
    body.egg #flash { animation: flash .2s linear; }
    @keyframes flash { 0% { opacity:.55; } 100% { opacity:0; } }
  </style>
</head>
<body>
  <div id="board"></div>

    var bits = [];
    var last = {};
    var konami = [];
    var up = [];
    var down = [];
    var zag = [];
    var drum = { i: -1, n: 0, t: 0 };
    var crestN = 0;
    var plateN = 0;
    var lastHit = 0;
    var KONAMI = [0,0,6,6,1,5,1,5,3,4];
    var UP = [6,5,4,3,2,1,0];
    var DOWN = [0,1,2,3,4,5,6];
    var ZAG = [0,6,1,5,2,4,3];

    function cool(id, ms) {
      var now = Date.now();
      if (now - (last[id] || 0) < (ms || 1600)) return false;
      last[id] = now;
      return true;
    }
    function snap() {
      try { var a = document.getElementById("click"); a.currentTime = 0; a.volume = 1; a.play().catch(function(){}); } catch (e) {}
    }
    function fire(id, pop) {
      if (!cool(id, 1500)) return;
      try {
        var s = document.getElementById("sting");
        s.currentTime = 0; s.volume = 1; s.play().catch(function(){});
      } catch (e) {}
      document.getElementById("popimg").src = POPS[pop] || POPS.spark;
      document.body.classList.remove("egg");
      void document.body.offsetWidth;
      document.body.classList.add("egg");
      setTimeout(function () { document.body.classList.remove("egg"); }, 1500);
    }
    function value() {
      var n = 0;
      for (var i = 0; i < 7; i++) if (bits[i]) n |= W[i];
      return n;
    }
    function paint() {
      var n = value();
      document.getElementById("bin").textContent = n.toString(2).padStart(7,"0");
      document.getElementById("dec").textContent = String(n);
      document.getElementById("hex").textContent = "0x" + n.toString(16).toUpperCase().padStart(2,"0");
      var labs = document.querySelectorAll("#place span");
      for (var i = 0; i < 7; i++) {
        var on = bits[i] === 1;
        if (labs[i]) labs[i].classList.toggle("off", !on);
        document.getElementById("s"+i).querySelector("img").src = on ? sqOn : sqOff;
        document.getElementById("b"+i).querySelector("img").src = on ? btnGreen : btnRed;
      }
      if (n === 127) fire("full", "spark");
      if (n === 42) fire("life", "wrench");
      if (n === 69) fire("nice", "pin");
      if (n === 13) fire("unlucky", "rat");
      if (n === 77) fire("luck", "spark");
      if (n === 85) fire("check", "pin");
      if (n === 33) fire("lodge", "wrench");
      if (n === 90) fire("zig", "spark");
      if (n === 112) fire("yard", "rat");
    }
    function seq(arr, next, id, pop) {
      var now = Date.now();
      if (now - lastHit > 2200) { arr.length = 0; }
      if (next === arr.length ? -1 : arr[arr.length]) {}
      if (arr.length < arr.target) {}
      if (next === (id === "up" ? UP[arr.length] : id === "down" ? DOWN[arr.length] : id === "zag" ? ZAG[arr.length] : KONAMI[arr.length])) {
        arr.push(next);
        var need = id === "konami" ? KONAMI.length : 7;
        if (arr.length === need) { arr.length = 0; fire(id, pop); }
      } else {
        arr.length = 0;
        var first = id === "konami" ? KONAMI[0] : id === "up" ? UP[0] : id === "down" ? DOWN[0] : ZAG[0];
        if (next === first) arr.push(next);
      }
    }
    function track(i) {
      var now = Date.now();
      if (now - lastHit > 2200) { konami = []; up = []; down = []; zag = []; }
      lastHit = now;
      function step(buf, pattern, id, pop) {
        if (i === pattern[buf.length]) {
          buf.push(i);
          if (buf.length === pattern.length) { buf.length = 0; fire(id, pop); }
        } else {
          buf.length = 0;
          if (i === pattern[0]) buf.push(i);
        }
      }
      step(konami, KONAMI, "konami", "jaws");
      step(up, UP, "up", "spark");
      step(down, DOWN, "down", "jaws");
      step(zag, ZAG, "zag", "pin");
      if (i === drum.i && now - drum.t < 700) {
        drum.n += 1;
        if (drum.n >= 3) { drum.n = 0; fire("drum", "rat"); }
      } else {
        drum.i = i; drum.n = 1;
      }
      drum.t = now;
    }
    function bang(id) {
      var el = document.getElementById(id);
      el.classList.remove("bang");
      void el.offsetWidth;
      el.classList.add("bang");
    }
    function toggle(i) {
      bits[i] = bits[i] ? 0 : 1;
      snap();
      bang("s"+i); bang("b"+i);
      track(i);
      paint();
    }
    var place = document.getElementById("place");
    var sq = document.getElementById("sq");
    var lp = document.getElementById("lp");
    for (var i = 0; i < 7; i++) {
      bits[i] = (start & W[i]) ? 1 : 0;
      place.innerHTML += "<span>" + W[i] + "</span>";
      sq.innerHTML += '<button type="button" class="cell" id="s'+i+'"><img alt=""></button>';
      lp.innerHTML += '<button type="button" class="lamp" id="b'+i+'"><img alt=""></button>';
    }
    for (var j = 0; j < 7; j++) {
      (function (i) {
        document.getElementById("s"+i).onclick = function () { toggle(i); };
        document.getElementById("b"+i).onclick = function () { toggle(i); };
      })(j);
    }
    document.getElementById("crest").onclick = function () {
      crestN += 1;
      if (crestN >= 7) { crestN = 0; fire("crest", "jaws"); }
    };
    document.getElementById("plate").onclick = function () {
      plateN += 1;
      if (plateN >= 3) { plateN = 0; fire("plate", "spark"); }
    };
    paint();
    var egg = "";
    try { egg = (new URLSearchParams(location.search).get("egg") || location.hash.replace("#","") || "").toLowerCase(); } catch (e) {}
    var qa = {
      konami:"jaws", full:"spark", void:"jaws", life:"wrench", nice:"pin",
      unlucky:"rat", luck:"spark", high:"jaws", check:"pin", lodge:"wrench",
      zig:"spark", yard:"rat", up:"spark", down:"jaws", crest:"jaws",
      plate:"spark", drum:"rat", zag:"pin", boom:"jaws"
    };
    if (qa[egg]) setTimeout(function () { fire(egg === "boom" ? "konami" : egg, qa[egg]); }, 200);
  })();
