  if (actx.state === "suspended") actx.resume();
  return true;
}

function setWave(osc, typeName) {
  if (typeName === "pulse") {
    if (!actx._pulse) {
      var real = new Float32Array(32);
      var imag = new Float32Array(32);
      for (var n = 1; n < 32; n += 2) imag[n] = 0.65 / n;
      actx._pulse = actx.createPeriodicWave(real, imag);
    }
    osc.setPeriodicWave(actx._pulse);
  } else {
    osc.type = typeName;
  }
}

function makeVoice(freq, when) {
  var type = NFTzFlare.WAVES[state.wave] || "sawtooth";
  var osc = actx.createOscillator();
  setWave(osc, type);
  osc.frequency.setValueAtTime(freq, when);
  var osc2 = null;
  if (state.dual) {
    osc2 = actx.createOscillator();
    setWave(osc2, type);
    osc2.frequency.setValueAtTime(freq * 1.007, when);
  }
  if (state.vib && actx._lfoGain) {
    actx._lfoGain.connect(osc.frequency);
    if (osc2) actx._lfoGain.connect(osc2.frequency);
  }
  var filter = actx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(NFTzFlare.cutoffHz(state.cutoff), when);
  filter.Q.value = 0.7 + state.res * 12;
  var g = actx.createGain();
  g.gain.setValueAtTime(0.0001, when);
  osc.connect(filter);
  if (osc2) osc2.connect(filter);
  var shaped = filter;
  if (state.drive > 0.04) {
    var sh = actx.createWaveShaper();
    var curve = new Float32Array(64);
    var amt = 1 + state.drive * 28;
    for (var i = 0; i < 64; i++) {
      var x = (i / 63) * 2 - 1;
      curve[i] = Math.tanh(x * amt);
    }
    sh.curve = curve;
    filter.connect(sh);
    shaped = sh;
  }
  shaped.connect(g);
  g.connect(master);
  if (state.delay > 0.04 && actx._delay) {
    var send = actx.createGain();
    send.gain.value = state.delay * 0.35;
    g.connect(send);
    send.connect(actx._delay);
    actx._delay.delayTime.setTargetAtTime(0.12 + state.delay * 0.22, when, 0.02);
  }
  var peak = (state.dual ? 0.13 : 0.18) * (1 - state.drive * 0.22);
  return { osc: osc, osc2: osc2, g: g, peak: Math.max(0.0002, peak), start: when };
}

function noteOn(key) {
  if (active[key]) noteOff(key);
  state.last = key;
  state.gate = true;
  try {
    if (!ensure()) { render(); return; }
    var t = actx.currentTime + 0.012;
    var f = NFTzFlare.freq(NFTzFlare.midi(state, key));
    var v = makeVoice(f, t);
    var atk = Math.max(0.01, NFTzFlare.attackSec(state.attack));
    var dec = Math.max(0.02, 0.03 + state.decay * 0.35);
    var sus = Math.max(0.0002, v.peak * Math.max(0.15, Math.min(0.92, state.sustain)));
    v.g.gain.exponentialRampToValueAtTime(v.peak, t + atk);
    v.g.gain.exponentialRampToValueAtTime(sus, t + atk + dec);
    v.osc.start(t);
    if (v.osc2) v.osc2.start(t);
    active[key] = v;
    born.push(key);
    while (born.length > 8) noteOff(born.shift());
  } catch (e) {}
  render();
}

function noteOff(key) {
  var v = active[key];
  var idx = born.indexOf(key);
  if (idx >= 0) born.splice(idx, 1);
  if (!v) {
    state.gate = Object.keys(active).length > 0;
    render();
    return;
  }
  delete active[key];
  try {
    var t = actx.currentTime + 0.01;
    var rel = Math.max(0.04, NFTzFlare.releaseSec(state.release));
    v.g.gain.cancelScheduledValues(t);
    var now = Math.max(0.0001, v.g.gain.value || 0.0001);
    v.g.gain.setValueAtTime(now, t);
    v.g.gain.exponentialRampToValueAtTime(0.0001, t + rel);
    var stopAt = Math.max(t + rel + 0.04, v.start + 0.02);
    v.osc.stop(stopAt);
    if (v.osc2) v.osc2.stop(stopAt);
  } catch (e) {}
  state.gate = Object.keys(active).length > 0;
  render();
}

function strike(key, when, hold) {
  var fit = NFTzFlare.fitStrike(
    NFTzFlare.attackSec(state.attack),
    0.03 + state.decay * 0.35,
    NFTzFlare.releaseSec(state.release),
    hold
  );
  if (when < actx.currentTime + 0.01) when = actx.currentTime + 0.01;
  var f = NFTzFlare.freq(NFTzFlare.midi(state, key));
  var v = makeVoice(f, when);
  var sus = Math.max(0.0002, v.peak * Math.max(0.2, Math.min(0.9, state.sustain)));
  var t1 = when + fit.atk;
  var t2 = when + fit.decEnd;
  var off = when + fit.off;
  var end = off + fit.rel;
  v.g.gain.exponentialRampToValueAtTime(v.peak, t1);
  v.g.gain.exponentialRampToValueAtTime(sus, t2);
  v.g.gain.setValueAtTime(sus, off);
  v.g.gain.exponentialRampToValueAtTime(0.0001, end);
  v.osc.start(when);
  if (v.osc2) v.osc2.start(when);
  var stopAt = end + 0.03;
  v.osc.stop(stopAt);
  if (v.osc2) v.osc2.stop(stopAt);
  v.end = stopAt;
  autoVoices.push(v);
  var now = actx.currentTime;
  if (autoVoices.length > 24) {
    autoVoices = autoVoices.filter(function (voice) { return voice.end > now; });
  }
  cues.push({ t: when, key: key, end: off });
  if (cues.length > 32) cues.splice(0, cues.length - 32);
}

function silenceAuto() {
  if (!actx) {
    autoVoices = [];
    return;
  }
  var t = actx.currentTime;
  autoVoices.forEach(function (v) {
    try {
      var kill = Math.max(t + 0.02, v.start + 0.005);
      v.g.gain.cancelScheduledValues(kill);
      v.g.gain.setValueAtTime(0.0001, kill);
      v.osc.stop(kill + 0.03);
      if (v.osc2) v.osc2.stop(kill + 0.03);
    } catch (e) {}
  });
  autoVoices = [];
}

function beat() {
  return 60 / Math.max(64, Math.min(168, state.bpm));
}

function eventAt(mode, index) {
  if (mode === "arp") return (state.home + ARP[index % ARP.length]) % 24;
  var steps = KIT.steps || [];
  if (!steps.length) return -1;
  return steps[index % steps.length];
}

function stopAuto() {
  playToken += 1;
  state.playing = false;
  state.mode = "";
  state.stepKey = -1;
  cues = [];
  if (pumpTimer) {
    clearTimeout(pumpTimer);
    pumpTimer = 0;
  }
  silenceAuto();
}

function startAuto(mode) {
  stopAuto();
  if (!ensure()) {
    render();
    return;
  }
  state.playing = true;
  state.mode = mode;
  state.last = state.home;
  var token = playToken;
  render();
  function arm() {
    if (token !== playToken || !state.playing) return;
    nextAt = actx.currentTime + 0.06;
    stepIndex = 0;
    cues = [];
    pump(token, mode);
    requestAnimationFrame(tickLamps);
  }
  var pending = actx.resume();
  if (pending && pending.then) pending.then(arm);
  else arm();
}

function pump(token, mode) {
  if (token !== playToken || !state.playing || !actx) return;
  var horizon = actx.currentTime + SCHEDULE_AHEAD;
  var step = beat();
  var guard = 0;
  while (nextAt < horizon && guard < 8) {
    guard += 1;
    if (nextAt < actx.currentTime + 0.02) nextAt = actx.currentTime + 0.05;
    var ev = eventAt(mode, stepIndex);
    if (ev >= 0) strike(ev, nextAt, step * 0.8);
    stepIndex += 1;
    nextAt += step;
  }
  pumpTimer = setTimeout(function () { pump(token, mode); }, PUMP_MS);
}

function tickLamps() {
  if (!state.playing || !actx) return;
  var now = actx.currentTime;
  var key = -1;
  for (var i = cues.length - 1; i >= 0; i--) {
    if (cues[i].t <= now && now < cues[i].end) {
      key = cues[i].key;
      break;
    }
  }
  if (key !== state.stepKey) {
    state.stepKey = key;
    if (key >= 0) state.last = key;
    render();
  }
  requestAnimationFrame(tickLamps);
}

function render() {
  document.querySelectorAll(".knob").forEach(function (el) {
    var v = state[el.dataset.knob];
    el.style.transform = "rotate(" + (-135 + v * 270) + "deg)";
  });
  var idle = Object.keys(active).length === 0 && !state.playing;
  function held(n) {
    return !!active[n] || (state.playing && state.stepKey === n);
  }
  document.querySelectorAll("[data-key]").forEach(function (el) {
    el.classList.toggle("on", held(Number(el.dataset.key)));
  });
  document.querySelectorAll("#lamps i").forEach(function (el) {
    var n = Number(el.dataset.lamp);
    el.classList.toggle("on", held(n) || (idle && n === state.home));
  });
  document.querySelectorAll("#names span").forEach(function (el) {
    var n = Number(el.dataset.name);
    el.classList.toggle("on", held(n) || (idle && n === state.home));
  });
  document.querySelectorAll("#wlamps i").forEach(function (el, idx) {
    el.classList.toggle("on", idx === state.wave);
  });
  document.getElementById("oct").textContent = (state.octave > 0 ? "+" : "") + state.octave;
  document.getElementById("dual").classList.toggle("on", state.dual);
  document.getElementById("vib").classList.toggle("on", state.vib);
  var play = document.getElementById("play");
  var arp = document.getElementById("arp");
  if (play) play.classList.toggle("on", state.playing && state.mode === "score");
  if (arp) arp.classList.toggle("on", state.playing && state.mode === "arp");
  var gate = document.getElementById("sig");
  if (gate) gate.classList.toggle("on", state.gate || state.playing);
  var shown = idle ? state.home : state.last;
  var modeName = state.mode === "arp" ? "ARP" : (state.playing ? "PLAY" : "READY");
  document.getElementById("readout").textContent =
    NFTzFlare.noteName(state, shown) + "  " + NFTzFlare.WAVE_NAMES[state.wave] + "  " + modeName;
  var trace = document.getElementById("trace");
  if (trace) {
    var pts = [
      "0,30 24,8 24,30 48,8 48,30 72,8 72,30 100,8",
      "0,28 0,10 50,10 50,28 100,28",
      "0,30 25,8 50,30 75,8 100,30",
      "0,30 8,8 16,30 24,8 32,30 40,8 48,30 56,8 64,30 72,8 80,30 88,8 100,30"
    ];
    trace.setAttribute("points", pts[state.wave] || pts[0]);
  }
}

function press(id, fn) {
  document.getElementById(id).addEventListener("pointerdown", function (e) {
    e.preventDefault();
    fn();
  }, { passive: false });
}

press("wave", function () {
  state.wave = (state.wave + 1) % 4;
  render();
});
press("octDown", function () {
  state.octave = Math.max(-2, state.octave - 1);
  render();
});
press("octUp", function () {
  state.octave = Math.min(2, state.octave + 1);
  render();
});
press("dual", function () {
  state.dual = !state.dual;
  render();
});
press("vib", function () {
  state.vib = !state.vib;
  render();
});
press("play", function () {
  if (state.playing && state.mode === "score") stopAuto();
  else startAuto("score");
  render();
});
press("arp", function () {
  if (state.playing && state.mode === "arp") stopAuto();
  else startAuto("arp");
  render();
});
press("stop", function () {
  stopAuto();
  render();
});

["selectstart", "dragstart", "contextmenu"].forEach(function (name) {
  document.addEventListener(name, function (e) { e.preventDefault(); });
});

window.addEventListener("keydown", function (e) {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " ") {
    e.preventDefault();
    if (state.playing) stopAuto();
    else startAuto("score");
    render();
    return;
  }
  if (down[e.key]) return;
  var key = KEYS[e.key];
  if (key == null) return;
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  e.preventDefault();
  down[e.key] = true;
  noteOn(key);
});
window.addEventListener("keyup", function (e) {
  var key = KEYS[e.key];
  if (key == null) return;
  down[e.key] = false;
  noteOff(key);
});
window.addEventListener("blur", function () {
  Object.keys(down).forEach(function (k) {
    var key = KEYS[k];
    down[k] = false;
    if (key != null) noteOff(key);
  });
});

function fit() {
  var s = document.querySelector(".shell");
  var n = Math.min(window.innerWidth, window.innerHeight);
  if (!n) return;
  s.style.width = n + "px";
  s.style.height = n + "px";
}
window.addEventListener("resize", fit);
paintChrome();
fit();
render();

if (new URLSearchParams(location.search).get("qa") === "1") {
  var lines = [];
  function check(name, ok, extra) {
    lines.push((ok ? "PASS" : "FAIL") + " " + name + (extra ? " " + extra : ""));
  }
  check("freq", Math.abs(NFTzFlare.freq(69) - 440) < 0.01);
  check("twentyfour", document.querySelectorAll("[data-key]").length === 24);
  var boardBox = document.getElementById("board").getBoundingClientRect();
  var whites = document.querySelectorAll(".white");
  var lastBox = whites[whites.length - 1].getBoundingClientRect();
  check("keys-fit", whites.length === 14 && lastBox.right <= boardBox.right + 1 && lastBox.left >= boardBox.left - 1 && lastBox.width > 4, "win " + window.innerWidth + " key " + lastBox.width.toFixed(1) + " board " + boardBox.width.toFixed(0));
  check("lamps", document.querySelectorAll("#lamps i").length === 24);
  check("names", document.querySelectorAll("#names span").length === 24);
  var dirty = 0;
  document.querySelectorAll("[data-key]").forEach(function (el) {
    if ((el.textContent || "").replace(/\s/g, "")) dirty += 1;
  });
  check("no-key-text", dirty === 0);
  var nose = getComputedStyle(document.body);
  check("noselect", nose.userSelect === "none" || nose.webkitUserSelect === "none");
  check("home-key-up", !document.querySelector('[data-key="' + KIT.home + '"]').classList.contains("on"));
  check("home-lamp", document.querySelector('#lamps [data-lamp="' + KIT.home + '"]').classList.contains("on"));
  check("buffer", SCHEDULE_AHEAD >= 0.3);
  var fit = NFTzFlare.fitStrike(0.4, 0.4, 1.2, 0.2);
  check("fit", fit.ok && fit.atk < 0.2);
  check("play", !!document.getElementById("play") && !!document.getElementById("stop") && !!document.getElementById("arp"));
  check("flames", (!!KIT.flames) === (document.querySelectorAll(".lick").length === 4));
  check("adsr", document.querySelectorAll(".knob").length === 6);
  var before = state.wave;
  document.getElementById("wave").dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
  check("wave", state.wave === (before + 1) % 4);
  noteOn(4);
  check("press", state.last === 4 && document.querySelector('#lamps [data-lamp="4"]').classList.contains("on"));
  noteOff(4);
  document.getElementById("play").dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
  check("auto", state.playing && state.mode === "score");
  var pre = document.createElement("pre");
  pre.id = "qa";
  function paintQa() {
    var fails = lines.filter(function (l) { return l.indexOf("FAIL") === 0; }).length;
    pre.textContent = (fails ? "FAILED " + fails : "ALL PASS " + lines.length) + "\n" + lines.join("\n");
  }
  paintQa();
  pre.style.cssText = "position:absolute;left:0;right:0;bottom:0;max-height:46%;overflow:auto;margin:0;background:#000;color:#ccff00;font:12px/1.35 ui-monospace,monospace;z-index:9;white-space:pre-wrap;padding:8px";
  document.body.appendChild(pre);
  setTimeout(function () {
    var lit = document.querySelectorAll("#lamps i.on").length;
    var moved = !!(actx && actx.currentTime > 0.08);
    check("queued-lamp", !moved || lit >= 1, "lit " + lit + " t " + (actx ? actx.currentTime.toFixed(3) : "0"));
    paintQa();
  }, 280);
}
