  e.preventDefault();
  playToggle();
});
document.getElementById("clear").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  NFTzPad.restore(state);
  lit = -1;
  render();
});
window.addEventListener("keydown", function (e) {
  if (e.key === " " || e.code === "Space") {
    e.preventDefault();
    playToggle();
    return;
  }
  if (e.key === "Escape") {
    e.preventDefault();
    NFTzPad.restore(state);
    lit = -1;
    render();
    return;
  }
  if (KEYS[e.key] == null) return;
  e.preventDefault();
  onPad(KEYS[e.key], 0.9);
});
function fit() {
  var s = document.querySelector(".shell");
  var n = Math.min(window.innerWidth, window.innerHeight);
  if (!n) return;
  s.style.width = n + "px";
  s.style.height = n + "px";
}
window.addEventListener("resize", fit);
paintChrome();
fit();
render();

if (new URLSearchParams(location.search).get("qa") === "1") {
  var lines = [];
  function check(name, ok, extra) {
    lines.push((ok ? "PASS" : "FAIL") + " " + name + (extra ? " " + extra : ""));
  }
  check("downbeat", (KIT.pattern[0] & 1) === 1, "mask=" + KIT.pattern[0]);
  check("sixteen", KIT.pattern.length === 16 && KIT.pads.length === 16);
  var snap = state.steps[0];
  onPad(3, 0.8);
  check("toggle", state.steps[0] === ((snap ^ (1 << 3)) >>> 0), "now=" + state.steps[0]);
  check("last", state.last === 3);
  NFTzPad.restore(state);
  check("restore", state.steps[0] === KIT.pattern[0] && state.cursor === 0 && state.playing === false);
  document.querySelector('[data-step="4"]').dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true }));
  check("lamp", state.cursor === 4);
  var pre = document.createElement("pre");
  pre.id = "qa";
  var fails = lines.filter(function (l) { return l.indexOf("FAIL") === 0; }).length;
  pre.textContent = (fails ? "FAILED " + fails : "ALL PASS " + lines.length) + "\n" + lines.join("\n");
  pre.style.cssText = "position:absolute;left:0;right:0;bottom:0;max-height:42%;overflow:auto;margin:0;background:#000;color:#ccff00;font:12px/1.35 ui-monospace,monospace;z-index:9;white-space:pre-wrap;padding:8px";
  document.body.appendChild(pre);
}

</script>
