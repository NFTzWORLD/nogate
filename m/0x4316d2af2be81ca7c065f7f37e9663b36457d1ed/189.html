<body>

<script>

var NFTzPad = (function () {
  function create(kit) {
    var home = kit.pattern.slice();
    return {
      steps: home.slice(),
      home: home,
      cursor: 0,
      playing: false,
      bpm: kit.bpm,
      swing: kit.swing,
      last: -1
    };
  }

  function hits(state, step) {
    var m = state.steps[step] || 0;
    var out = [];
    for (var i = 0; i < 16; i++) if (m & (1 << i)) out.push(i);
    return out;
  }

  function toggle(state, pad) {
    var m = state.steps[state.cursor] || 0;
    state.steps[state.cursor] = (m ^ (1 << pad)) >>> 0;
    state.last = pad;
  }

  function restore(state) {
    state.steps = state.home.slice();
    state.cursor = 0;
    state.playing = false;
    state.last = -1;
  }

  return { create: create, hits: hits, toggle: toggle, restore: restore };
})();

var KIT = {"id": 189, "slug": "magenta-push-189", "title": "MAGENTA \u00b7 PUSH 134", "room": "Magenta", "room_id": "magenta", "groove": "PUSH", "bpm": 134, "swing": 59, "tune": 1, "color": "Magenta", "accent": "#ff2ea6", "body": "#240814", "body2": "#381022", "ink": "#ffe4f4", "lcd": "#160c12", "digit": "#ffb3dc", "pads": ["#ff2ea6", "#ffd6ec", "#ffb3dc", "#3a1828", "#ff68be", "#ffb3dc", "#3a1828", "#ffd6ec", "#ff2ea6", "#3a1828", "#ffd6ec", "#ff7dc6", "#ff2ea6", "#ffb3dc", "#ffd6ec", "#3a1828"], "pattern": [3081, 8, 2049, 0, 14, 8, 0, 8192, 2057, 8, 1, 0, 14, 8200, 32, 54], "emotion": "Push", "shape": "Pad", "size": "Sixteen", "set": "AMP", "hint": "Magenta room. PUSH at 134 BPM. Swing 59. Tap a pad. Press play. While stopped, a pad writes that sound onto the lit step."};
/* AMP pad face. KIT is baked above this script. */
var LABELS = ["KIK","SNR","CLP","HAT","OPN","TOM","CNG","RIM","COW","SHK","CLK","BAS","STB","PRC","TMB","RID"];
var KEYS = {

  "a": 8, "s": 9, "d": 10, "f": 11,
  "z": 12, "x": 13, "c": 14, "v": 15,

var state = NFTzPad.create(KIT);
var actx = null;
var master = null;
var noiseBuf = null;
var nextNote = 0;
var lit = -1;

function lum(hex) {
  var h = hex.replace("#", "");
  var r = parseInt(h.slice(0, 2), 16);
  var g = parseInt(h.slice(2, 4), 16);
  var b = parseInt(h.slice(4, 6), 16);

}
function paintChrome() {

  shell.style.setProperty("--body", KIT.body);
  shell.style.setProperty("--body2", KIT.body2);
  shell.style.setProperty("--ink", KIT.ink);
  shell.style.setProperty("--accent", KIT.accent);
  shell.style.setProperty("--lcd", KIT.lcd);
  shell.style.setProperty("--digit", KIT.digit);

    var b = document.createElement("button");
    b.type = "button";
    b.className = "pad";
    b.setAttribute("data-pad", String(i));
    b.style.background = color;
    b.style.color = lum(color) > 168 ? "#161616" : "#f6f6f6";
    b.innerHTML = "<b>" + LABELS[i] + "</b>";
    b.addEventListener("pointerdown", function (e) {
      e.preventDefault();

      onPad(i, vel);
    });
    pads.appendChild(b);

  for (var s = 0; s < 16; s++) {
    var lamp = document.createElement("button");
    lamp.type = "button";
    lamp.className = "lamp";
    lamp.setAttribute("data-step", String(s));

      e.preventDefault();
      if (state.playing) return;
      state.cursor = Number(this.getAttribute("data-step"));
      render();
    });
    steps.appendChild(lamp);
  }
}
function render() {
  var show = state.playing && lit >= 0 ? lit : state.cursor;
  document.querySelectorAll(".lamp").forEach(function (el) {
    var n = Number(el.getAttribute("data-step"));
    el.classList.toggle("on", n === show);
    el.classList.toggle("beat", (state.steps[n] & 1) !== 0 || (state.steps[n] & 2) !== 0);
  });
  var mask = state.steps[show] || 0;
  document.querySelectorAll(".pad").forEach(function (el) {
    var n = Number(el.getAttribute("data-pad"));
    el.classList.toggle("on", (mask & (1 << n)) !== 0);
  });
  document.getElementById("play").classList.toggle("go", state.playing);
  document.getElementById("play").textContent = state.playing ? "STOP" : "PLAY";
}
function noise() {
  if (noiseBuf) return noiseBuf;
  var len = actx.sampleRate;
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  var d = noiseBuf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}
function ensure() {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  if (!actx) {
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.85;
    var comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 8;
    comp.ratio.value = 3;
    comp.attack.value = 0.003;
    comp.release.value = 0.16;
    master.connect(comp);
    comp.connect(actx.destination);
  }
  if (actx.state === "suspended") actx.resume();
  return true;
}
function env(t, peak, attack, dur) {
  var g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001, peak), t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  return g;
}
function tone(type, freq, t, peak, attack, dur, dest) {
  var o = actx.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(30, freq), t);
  var g = env(t, peak, attack, dur);
  o.connect(g);
  g.connect(dest || master);
  o.start(t);
  o.stop(t + dur + 0.02);
  return o;
}
function burst(t, dur, peak, type, freq, q) {
  var src = actx.createBufferSource();
  src.buffer = noise();
  var f = actx.createBiquadFilter();
  f.type = type;
  f.frequency.value = freq;
  if (q) f.Q.value = q;
  var g = env(t, peak, 0.004, dur);
  src.connect(f);
  f.connect(g);
  g.connect(master);
  src.start(t);
  src.stop(t + dur + 0.02);
}
function tuned(freq) {

}
function voice(i, t, vel) {
  if (!ensure()) return;

  if (i === 0) {
    var o = actx.createOscillator();
    o.type = "sine";

    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.32);

  } else if (i === 4) {
    burst(t, 0.38, 0.18 * vel, "highpass", 6000, 0.6);

  } else if (i === 11) {

  } else if (i === 12) {
    tone("triangle", tuned(196), t, 0.1 * vel, 0.005, 0.18);
    tone("triangle", tuned(247), t, 0.07 * vel, 0.005, 0.16);
  } else if (i === 13) {
    var p = actx.createOscillator();
    p.type = "sine";
    p.frequency.setValueAtTime(520, t);
    p.frequency.exponentialRampToValueAtTime(180, t + 0.08);

    p.connect(pg); pg.connect(master);
    p.start(t); p.stop(t + 0.14);
  } else if (i === 14) {
    burst(t, 0.14, 0.14 * vel, "bandpass", 3200, 1.2);
  } else if (i === 15) {
    tone("triangle", 740, t, 0.05 * vel, 0.002, 0.22);
    burst(t, 0.2, 0.08 * vel, "highpass", 5000, 0.5);
  }
}
function onPad(i, vel) {
  if (!state.playing) NFTzPad.toggle(state, i);
  else state.last = i;
  try { voice(i, ensure() ? actx.currentTime : 0, vel); } catch (e) {}
  var el = document.querySelector('[data-pad="' + i + '"]');
  if (el) {
    el.classList.add("hit");
    setTimeout(function () { el.classList.remove("hit"); }, 90);
  }
  render();
}
function stepDur(step) {
  var base = 60 / state.bpm / 4;
  var bias = Math.max(0, Math.min(0.42, (state.swing - 50) / 50 * 0.42));
  return base * (step % 2 === 0 ? 1 + bias : 1 - bias);
}
function scheduler() {
  if (!state.playing || !actx) return;
  var horizon = actx.currentTime + 0.14;
  var guard = 0;
  while (nextNote < horizon && guard < 32) {
    guard += 1;
    var step = state.cursor;
    NFTzPad.hits(state, step).forEach(function (p) {
      try { voice(p, nextNote, 0.86); } catch (e) {}
    });
    lit = step;
    nextNote += stepDur(step);
    state.cursor = (step + 1) % 16;
  }
  render();
  requestAnimationFrame(scheduler);
}
function playToggle() {
  state.playing = !state.playing;
  if (state.playing) {
    try { ensure(); } catch (e) { state.playing = false; }
    if (state.playing && actx) {
      state.cursor = 0;
      lit = 0;
      nextNote = actx.currentTime + 0.06;
      requestAnimationFrame(scheduler);
    }
  } else {
    lit = -1;
  }
  render();
}
document.getElementById("play").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  playToggle();
});
document.getElementById("clear").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  NFTzPad.restore(state);
  lit = -1;
  render();

window.addEventListener("keydown", function (e) {
  if (e.key === " " || e.code === "Space") {
    e.preventDefault();

  }
  if (e.key === "Escape") {
    e.preventDefault();
    NFTzPad.restore(state);
    lit = -1;

  }

  e.preventDefault();
  onPad(KEYS[e.key], 0.9);

function fit() {

  var n = Math.min(window.innerWidth, window.innerHeight);
  if (!n) return;

window.addEventListener("resize", fit);

if (new URLSearchParams(location.search).get("qa") === "1") {
