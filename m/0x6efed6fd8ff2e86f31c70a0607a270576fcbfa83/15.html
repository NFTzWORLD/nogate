    }
    #board::after {
      content:""; position:absolute; inset:0;
      background:rgba(0,0,0,.42); pointer-events:none;
    }
    #machine {
      position:absolute; inset:0; z-index:1;
      display:flex; flex-direction:column;
      padding:4% 5% 3%;
      box-sizing:border-box;
    }
    .place {
      display:grid; grid-template-columns:repeat(4,1fr);
      text-align:center; color:#ffd24a;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(18px,4.6vw,42px); letter-spacing:.12em;
      text-shadow:0 1px 0 #000;
    }
    .place span.off { color:#8a7a62; }
    .row {
      display:grid; grid-template-columns:repeat(4,1fr);
      gap:1%; flex:1; align-items:center;
    }
    .cell {
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; height:100%;
    }
    .cell img {
      width:78%; height:auto; display:block; pointer-events:none;
      filter:drop-shadow(0 8px 18px rgba(0,0,0,.55));
    }
    .cell img.bulb { width:72%; }
    .cell.on img.bulb { animation:flick 2.6s ease-in-out infinite; }
    @keyframes flick {
      0%,100% { filter:drop-shadow(0 0 10px rgba(255,176,40,.35)) brightness(1); }
      42% { filter:drop-shadow(0 0 18px rgba(255,200,70,.55)) brightness(1.08); }
      73% { filter:drop-shadow(0 0 8px rgba(255,160,30,.28)) brightness(.97); }
    }
    #read {
      margin-top:2%;
      background:rgba(6,6,8,.82);
      border:1px solid #2a2418;
      padding:3% 4%;
      font-family:ui-monospace,Menlo,Consolas,monospace;
    }
    .line {
      display:flex; justify-content:space-between; align-items:baseline;
      padding:.15em 0;
    }
    .lab { color:#8a7a62; font-size:clamp(11px,2.4vw,16px); letter-spacing:.16em; text-transform:uppercase; }
    .val { font-size:clamp(18px,4.2vw,34px); letter-spacing:.08em; }
    #bin { color:#00ff6a; }
    #dec { color:#ffb000; }
    #hex { color:#ff2ea6; }
  </style>
</head>
<body>
  <div id="board"></div>
  <div id="machine">
    <div class="place" id="place">
      <span data-i="0">8</span><span data-i="1">4</span><span data-i="2">2</span><span data-i="3">1</span>
    </div>
    <div class="row" id="bulbs"></div>
    <div class="row" id="switches"></div>
    <div id="read">
      <div class="line"><span class="lab">base 2</span><span class="val" id="bin">0000</span></div>
      <div class="line"><span class="lab">base 10</span><span class="val" id="dec">0</span></div>
      <div class="line"><span class="lab">base 16</span><span class="val" id="hex">0x0</span></div>

    var click = document.getElementById("click");
    var bulbs = document.getElementById("bulbs");
    var switches = document.getElementById("switches");

    function snap() {
      try { click.currentTime = 0; click.volume = 1; click.play().catch(function(){}); } catch (e) {}
    }
    function value() {
      return (bits[0]<<3) | (bits[1]<<2) | (bits[2]<<1) | bits[3];
    }
    function paint() {
      var n = value();
      document.getElementById("bin").textContent = n.toString(2).padStart(4,"0");
      document.getElementById("dec").textContent = String(n);
      document.getElementById("hex").textContent = "0x" + n.toString(16).toUpperCase();
      for (var i = 0; i < 4; i++) {
        var on = bits[i] === 1;
        var b = document.getElementById("b"+i);
        var s = document.getElementById("s"+i);
        var p = document.querySelector('#place [data-i="'+i+'"]');
        b.classList.toggle("on", on);
        s.classList.toggle("on", on);
        p.classList.toggle("off", !on);
        b.querySelector("img").src = on ? bulbOn : bulbOff;
        s.querySelector("img").src = on ? swUp : swDown;
      }
    }
    function toggle(i) {
      bits[i] = bits[i] ? 0 : 1;
      snap();
      paint();
    }
    function cell(id, kind) {
      var el = document.createElement("div");
      el.className = "cell";
      el.id = id;
      var img = document.createElement("img");
      img.className = kind;
      img.alt = "";
      el.appendChild(img);
      return el;
    }
    for (var i = 0; i < 4; i++) {
      (function (i) {
        var b = cell("b"+i, "bulb");
        var s = cell("s"+i, "sw");
        b.addEventListener("click", function(){ toggle(i); });
        s.addEventListener("click", function(){ toggle(i); });
        b.addEventListener("touchstart", function(ev){ ev.preventDefault(); toggle(i); }, {passive:false});
        s.addEventListener("touchstart", function(ev){ ev.preventDefault(); toggle(i); }, {passive:false});
        bulbs.appendChild(b);
        switches.appendChild(s);
      })(i);
    }
    bits = [
      (start & 8) ? 1 : 0,
      (start & 4) ? 1 : 0,
      (start & 2) ? 1 : 0,
      (start & 1) ? 1 : 0
    ];
    paint();
  })();
  </script>
